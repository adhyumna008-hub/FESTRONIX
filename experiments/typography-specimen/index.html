<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FESTRONIX typography comparison — provisional</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Barlow+Condensed:wght@700&family=Fraunces:wght@700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@700&family=Sora:wght@700&family=Space+Grotesk:wght@700&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#171717;font-family:Manrope,Arial,sans-serif;font-size:16px;line-height:1.6}header,main{max-width:1320px;margin:auto;padding:24px}h1{font-size:24px;margin:0}p{margin:10px 0}label{display:block}button,select,input{font:inherit}button,select{padding:10px;border:1px solid #555;background:white;color:#171717}button{cursor:pointer}a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #171717;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:end}.notice{font-size:14px;max-width:80ch}#status{font-weight:600}.pair{margin:0 0 40px;background:#fff;border:1px solid #777;padding:24px}.pair>h2{font:600 18px Manrope,Arial,sans-serif;margin:0 0 12px}.compare{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:24px}.desktop{min-width:0}.mobile{width:392px;height:780px;border:1px solid #777;overflow:hidden}.mobile iframe{width:390px;height:778px;border:0}.sample{padding:24px;background:white;min-width:0}.display{font-family:var(--display),Arial,sans-serif;font-weight:700;letter-spacing:-.015em;line-height:1.08}.brand{font-size:clamp(48px,6.7vw,100px);margin:20px 0;overflow-wrap:anywhere}.edition{font-size:32px;margin:16px 0}.tagline{font-size:36px;margin:16px 0}.section{font-size:32px;margin:28px 0 16px}.nav{display:flex;flex-wrap:wrap;gap:20px;font-weight:600}.nav a{padding:8px 0}.card{border:1px solid #aaa;padding:20px}.card h4{font-size:28px;margin:6px 0 16px}.body{max-width:64ch}.meta{font-size:14px}.numbers{font-variant-numeric:lining-nums tabular-nums}.prize{font-size:24px;font-weight:700}.countdown{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}.countdown b{font-size:28px;display:block;line-height:1.2}.countdown span{font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.form{margin:24px 0;max-width:460px}.form input{display:block;width:100%;padding:10px;border:1px solid #777}.error{font-size:14px;font-weight:500}.table-wrap{overflow:auto}table{border-collapse:collapse;font-size:14px;width:100%;min-width:380px}th,td{padding:8px;text-align:left;border-bottom:1px solid #aaa;vertical-align:top}.glyphs{font-size:16px;overflow-wrap:anywhere}.sample-note{font-size:13px;margin:0 0 8px}.solo header{display:none}.solo main{padding:0;max-width:none}.solo .sample{padding:20px}.solo .brand{font-size:48px}.solo .edition{font-size:28px}.solo .tagline,.solo .section{font-size:30px}.solo .card h4{font-size:26px}.solo .card{padding:16px}.dark .sample{background:#171717;color:#fff}.dark .card{border-color:#777}.dark button,.dark input{background:#171717;color:#fff;border-color:#aaa}
@media(max-width:1000px){.compare{grid-template-columns:1fr}.mobile{max-width:100%}}@media(max-width:500px){header,main{padding:16px}.pair{padding:12px}.sample{padding:16px}.brand{font-size:48px}.edition{font-size:28px}.tagline{font-size:30px}.mobile{display:none}.card{padding:16px}}
input::placeholder{color:#555;opacity:1}.dark input::placeholder{color:#aaa}.controls label{max-width:100%}.controls select{display:block;max-width:100%}
</style></head><body><header><h1>FESTRONIX typography comparison</h1><p class="notice">Temporary specimen · all fonts provisional · identical copy, sizes, weight 700 and neutral surfaces. Mobile panes are real 390 px documents. Sample dates, amounts and names are fictional. Buttons/forms are specimens only.</p><div class="controls"><label>Combination<select id="filter"><option value="all">All nine combinations</option></select></label><label>Surface<select id="surface"><option value="light">Light</option><option value="dark">Dark</option></select></label></div><p id="status" role="status">Loading web fonts…</p></header><main id="samples"></main>
<script>
const pairs=[['pulse-space','Pulse','Space Grotesk'],['pulse-syne','Pulse','Syne'],['pulse-jakarta','Pulse','Plus Jakarta Sans'],['panel-barlow','Panel','Barlow Condensed'],['panel-archivo','Panel','Archivo'],['panel-fraunces','Panel','Fraunces'],['flux-sora','Flux','Sora'],['flux-syne','Flux','Syne'],['flux-outfit','Flux','Outfit']];
const query=new URLSearchParams(location.search),solo=query.get('sample');
function sample(id){return `<div class="sample"><nav class="nav" aria-label="Sample navigation"><a href="#${id}-events">Events</a><a href="#${id}-events">Schedule</a><a href="#${id}-form">Visit & help</a><a href="#${id}-table">Dashboard</a></nav><div class="display brand">FESTRONIX</div><div class="display edition">FESTRONIX 2K27</div><div class="display tagline">Build. Break. Discover.</div><p class="numbers">October 18–19, 2027 · 09:05 AM</p><div class="actions"><button type="button">Explore events</button><button type="button">View schedule</button></div><h3 class="display section" id="${id}-events">Discover what you can build.</h3><article class="card"><p class="meta">Game development · Team event</p><h4 class="display">Quantum Game Development Challenge</h4><p class="body">Turn an unexpected idea into a playable game. Work with your team to design, build and present a prototype that combines inventive mechanics with a clear player experience.</p><p class="prize numbers">₹1,25,000 Prize Pool</p><p class="numbers">09:05 AM · October 18–19, 2027</p><button type="button">View event details</button></article><p class="body">FESTRONIX brings students together to experiment, learn and share their work. Discover competitions and workshops, check the event rules, and choose the challenges that fit your interests.</p><div class="countdown numbers" aria-label="Example countdown"><span><b>08</b>Days</span><span><b>09</b>Hours</span><span><b>05</b>Minutes</span><span><b>27</b>Seconds</span></div><div class="form" id="${id}-form"><label for="${id}-name">Participant name</label><input id="${id}-name" value="Aarav Rao" readonly><label for="${id}-email">Email address</label><input id="${id}-email" placeholder="name@example.edu" aria-invalid="true" aria-describedby="${id}-error"><p class="error" id="${id}-error">Error: Enter a valid email address to continue.</p></div><p class="meta">Compact admin UI · shared Manrope</p><div class="table-wrap" id="${id}-table" tabindex="0" role="region" aria-label="Scrollable sample admin table"><table><thead><tr><th>Participant</th><th>Entry</th><th>Status</th><th>Time</th></tr></thead><tbody><tr><td>Aarav Rao</td><td>FX-2K27-0108</td><td>Payment verification pending</td><td class="numbers">09:05 AM</td></tr></tbody></table></div><p class="glyphs numbers">₹1,25,000 · 0 O · 1 I l · 8 B · 2K27 · 18–19 · +91 · 09:05</p></div>`}
if(solo){document.body.classList.add('solo');if(query.get('surface')==='dark')document.body.classList.add('dark');const pair=pairs.find(p=>p[0]===solo)||pairs[0];document.getElementById('samples').innerHTML=sample(pair[0]);document.getElementById('samples').style.setProperty('--display',`"${pair[2]}"`)}else{for(const [id,theme,font] of pairs){document.getElementById('filter').add(new Option(`${theme}: ${font} + Manrope`,id));const section=document.createElement('section');section.className='pair';section.id=id;section.style.setProperty('--display',`"${font}"`);section.innerHTML=`<h2>${theme} · ${font} + Manrope</h2><div class="compare"><div class="desktop"><p class="sample-note">Desktop scale · equal settings</p>${sample(id)}</div><div><p class="sample-note">390 px mobile-width preview</p><div class="mobile"><iframe title="${theme} ${font} mobile specimen" src="?sample=${id}"></iframe></div></div></div>`;document.getElementById('samples').append(section)}document.getElementById('filter').onchange=e=>{document.querySelectorAll('.pair').forEach(s=>s.hidden=e.target.value!=='all'&&s.id!==e.target.value)};document.getElementById('surface').onchange=e=>{document.body.classList.toggle('dark',e.target.value==='dark');document.querySelectorAll('iframe').forEach(f=>{const u=new URL(f.src);u.searchParams.set('surface',e.target.value);f.src=u})}}
Promise.all([...new Set(['Manrope',...pairs.map(p=>p[2])])].map(f=>document.fonts.load(`700 32px "${f}"`))).then(results=>{const ok=results.every(r=>r.length>0);document.getElementById('status').textContent=ok?'All nine families loaded. No font selection is final.':'Font load incomplete — do not judge fallback text as the intended family.'}).catch(()=>document.getElementById('status').textContent='Font request failed — internet access to Google Fonts is required.');
</script></body></html>
